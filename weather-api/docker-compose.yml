services:
  postgres:
    image: postgres:16
    container_name: weather-api-postgres
    environment:
      POSTGRES_DB: weatherdb
      POSTGRES_USER: weather
      POSTGRES_PASSWORD: weather
    ports:
      - "5432:5432"
    volumes:
      - weather_pg_data:/var/lib/postgresql/data

volumes:
  weather_pg_data:
