spring:
  application:
    name: weather-api

  # Default profile: expects Postgres running via `docker compose up` (see docker-compose.yml)
  datasource:
    url: jdbc:postgresql://localhost:5432/weatherdb
    username: weather
    password: weather
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

---
# Run with: --spring.profiles.active=h2
# Zero-setup profile: in-memory H2 DB, no Docker required. Data is lost on restart.
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:weatherdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
